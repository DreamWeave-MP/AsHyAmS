<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>DreamWeave Network</title>
  <defs>
    <radialGradient id="dw-net-core" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.5" stop-color="#ecd18f"/>
      <stop offset="1" stop-color="#a97a24"/>
    </radialGradient>
    <linearGradient id="dw-net-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fdcb0" stop-opacity="0"/>
      <stop offset="1" stop-color="#8fdcb0" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="#0d0913"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="11.75" fill="none" stroke="#2a1f3d" stroke-width="2.5"/>
  <!-- the scan: a crawl going round the network -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#2a1f3d" stroke-width="2" stroke-dasharray="2.2 3.4"/>
  <path d="M32 5 A27 27 0 0 1 55.4 18.5" fill="none" stroke="url(#dw-net-sweep)" stroke-width="3" stroke-linecap="round"/>
  <!-- the weave: the DreamWeave diamond threaded through a square -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="butt">
    <rect x="18" y="18" width="28" height="28" stroke="#0d0913" stroke-width="7.5"/>
    <rect x="18" y="18" width="28" height="28" stroke="#7d4fc9" stroke-width="4"/>
    <path d="M32 9.5 L54.5 32 L32 54.5 L9.5 32 Z" stroke="#0d0913" stroke-width="8"/>
    <path d="M32 9.5 L54.5 32 L32 54.5 L9.5 32 Z" stroke="#c6a0f6" stroke-width="4.5"/>
    <!-- where the square passes over -->
    <g>
      <path d="M36 18h8M46 36v8M28 46h-8M18 28v-8" stroke="#0d0913" stroke-width="7.5"/>
      <path d="M35 18h10M46 35v10M29 46h-10M18 29v-10" stroke="#7d4fc9" stroke-width="4"/>
    </g>
  </g>
  <!-- the sites, each at a point of the map -->
  <g fill="#8fdcb0" stroke="#0d0913" stroke-width="2.5">
    <rect x="27.5" y="5" width="9" height="9" rx="1.5" transform="rotate(45 32 9.5)"/>
    <rect x="50" y="27.5" width="9" height="9" rx="1.5" transform="rotate(45 54.5 32)"/>
    <rect x="27.5" y="50" width="9" height="9" rx="1.5" transform="rotate(45 32 54.5)"/>
    <rect x="5" y="27.5" width="9" height="9" rx="1.5" transform="rotate(45 9.5 32)"/>
  </g>
  <!-- the index at the center: an observer, not an authority -->
  <circle cx="32" cy="32" r="7.5" fill="#0d0913"/>
  <circle cx="32" cy="32" r="5.2" fill="url(#dw-net-core)"/>
</svg>

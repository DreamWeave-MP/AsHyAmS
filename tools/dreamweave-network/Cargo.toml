[package]
name = "dreamweave-network"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-or-later"
description = "Crawler, change tracker and static site generator for the DreamWeave Network index"
repository = "https://github.com/DreamWeave-MP/AsHyAmS"

[dependencies]
jsonschema = { version = "0.58.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
url = "2.5.8"

# The library half exists for the binary and its integration tests, not for other crates, so the
# lints about documenting a public API's errors and panics would only add ceremony.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
